ent worked, what did not work, and why, by using planned objectives and performance frameworks as a reference. While monitoring identifies signals like falling participation or unintended effects, evaluation seeks to understand what changed, what did not change, and the possible reasons for those changes, distinguishing completed activities from actual evidence of results.","sourceIds":["cbd-4:04-04","cbd-5:05-01"],"example":"","uncertainty":"","sources":[{"id":"cbd-4:04-04","title":"Monitor implementation and respond early","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"8","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"}},{"id":"cbd-5:05-01","title":"Ask what changed and why","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 5 — Evaluation & Adjustment (July 2023)","pages":"4","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L05_LP_Evaluation and Adjustment_072023.pdf","planSha256":"42e1f1956475b1a0fb4fbf01a9c1108a701c3abe655ee9a54b508fc3b6bf7400"}}],"metrics":{"elapsedMs":10022,"tokens":322,"loadMs":1.118333,"generationMs":6148.096},"elapsedMs":10022,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X21","domain":"11. Transition & sustainability","question":"Why does Lesson 6 insist that four connected principles make activity transition a staged process rather than a single handover ceremony?","context":{"lessonId":"cbd-6","screenId":"06-03","mode":"screen"},"criteria":"Ground handover in principled staging, joint preparation, readiness, and institutional continuity rather than ceremonial exit.","expectRetrieve":true,"expectedRelevantIds":["cbd-6:06-03"],"retrieved":["cbd-6:06-03","cbd-6:06-05"],"retrievedPassages":[{"id":"cbd-6:06-03","title":"Four principles make transition a process","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"6–7","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"},"excerpt":"Early planning, UN integration, local ownership and communication should shape transition throughout the activity.\nBegin planning early, consider more than one scenario and keep the plan flexible.\nCoordinate relevant UN actors from the outset.\nEngage counterparts and secure meaningful local leadership and ownership.\nCommunicate consistently so different stakeholders understand the intended responsibilities and limits.\nTransition readiness grows through coordinated preparation, not a final ceremony.\nImagine a handov"},{"id":"cbd-6:06-05","title":"Phase responsibility and test readiness","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"9–11","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"},"excerpt":"Transition planning should combine performance evidence, integrated assessment and continuing support needs.\nReview objectives and performance measures regularly rather than assuming readiness.\nAssess rights implications and how transition may affect women, men, girls and boys.\nConsider political and security uncertainty, funding and contingency scenarios.\nHand over tasks over time while monitoring progress and counterpart capacity.\nPlan continued political and financial support, including gender-responsive resourc"}],"status":"generated","modelInvoked":true,"answer":"Lesson 6 teaches that transition is a staged process because readiness is built through coordinated preparation rather than a single ceremony. The four principles—early planning, UN integration, local ownership, and communication—must shape the activity throughout its duration to ensure sustainability. Relying on a final ceremony fails to resolve gaps if the receiving institution was not involved in planning or if stakeholders have unmanaged expectations. Furthermore, the principles are interconnected: communication without ownership may lead to unsustainable decisions, and early planning without integration may leave other actors' obligations unresolved. Therefore, transition involves phasing the handover of tasks over time based on assessed responsibilities and capability.","sourceIds":["cbd-6:06-03","cbd-6:06-05"],"example":"In a police capacity-building mission, instead of a single event where all training responsibilities are transferred to the local police, the mission uses a phased approach. The inputs (trainers and training modules) are used in activities (gradual transfer of specific unit oversight) to produce outputs (local officers demonstrating competency in specific tasks). This leads to the outcome of increased local capability and the goal of sustainable local police leadership, ensuring the transition is a continuous process of building capacity rather than a sudden handover.","uncertainty":"","sources":[{"id":"cbd-6:06-03","title":"Four principles make transition a process","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"6–7","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"}},{"id":"cbd-6:06-05","title":"Phase responsibility and test readiness","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"9–11","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"}}],"metrics":{"elapsedMs":14798,"tokens":436,"loadMs":1.597208,"generationMs":10891.51},"elapsedMs":14798,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X22","domain":"11. Transition & sustainability","question":"How should advisers structure phased responsibility and post-handover fallback support when a police unit is only partially ready?","context":{"lessonId":"cbd-6","screenId":"06-05","mode":"screen"},"criteria":"Phase operational duties progressively, verify readiness objectively, and specify bounded post-transition monitoring/support arrangements.","expectRetrieve":true,"expectedRelevantIds":["cbd-6:06-05","cbd-6:06-07"],"retrieved":["cbd-6:06-05"],"retrievedPassages":[{"id":"cbd-6:06-05","title":"Phase responsibility and test readiness","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"9–11","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"},"excerpt":"Transition planning should combine performance evidence, integrated assessment and continuing support needs.\nReview objectives and performance measures regularly rather than assuming readiness.\nAssess rights implications and how transition may affect women, men, girls and boys.\nConsider political and security uncertainty, funding and contingency scenarios.\nHand over tasks over time while monitoring progress and counterpart capacity.\nPlan continued political and financial support, including gender-responsive resourc"}],"status":"generated","modelInvoked":true,"answer":"Advisers should structure the transition by handing over tasks over time, ensuring the pace of handover follows assessed responsibilities and capability. Rather than assuming readiness, advisers must regularly review objectives and performance measures, monitoring progress and counterpart capacity as external engagement reduces. The structure should include an integrated assessment that incorporates human rights and gender analysis, alongside considerations for political and security uncertainty, funding, and contingency scenarios. To ensure sustainability, planning must address long-term political and financial support needs, including gender-responsive resource requirements, while monitoring the ability of counterparts to assume residual responsibilities.","sourceIds":["cbd-6:06-05"],"example":"In a police training program, an adviser identifies that a local unit can independently manage patrol scheduling (output) but still requires supervision for forensic evidence processing (activity). The adviser implements a phased handover where patrol management is transferred first, while maintaining support for forensics, monitoring the unit's capability to handle both as external involvement decreases.","uncertainty":"","sources":[{"id":"cbd-6:06-05","title":"Phase responsibility and test readiness","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"9–11","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"}}],"metrics":{"elapsedMs":13210,"tokens":367,"loadMs":28.622958,"generationMs":8382.607},"elapsedMs":13210,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X23","domain":"12. Peace-ops framing & boundaries","question":"When a mission considers supporting host-state police census or vetting, why must planners verify a clear mandate first instead of treating it as routine mentoring?","context":{"lessonId":"cbd-3","screenId":"03-04","mode":"screen"},"criteria":"Highlight political sensitivity, legal/human-rights stakes, and explicit mandate requirement in peace operations.","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-04"],"retrieved":["cbd-3:03-04"],"retrievedPassages":[{"id":"cbd-3:03-04","title":"Census and vetting require a distinct mandate","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"12–13","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"Identifying the personnel body and assessing eligibility are sensitive institutional processes, not general substitutes for training or supervision.\nCensus and vetting define the relevant personnel body and eligibility under the applicable criteria.\nNational ownership, law, due process, individual rights, risk management and relevant expertise are essential to the source’s treatment.\nA mandate determines the adviser’s role. Vetting does not replace criminal prosecution of human-rights violations. This teaching over"}],"status":"generated","modelInvoked":true,"answer":"Planners must verify a clear mandate because a mandate determines the adviser's specific role in the process. Census and vetting are sensitive institutional processes used to define the personnel body and eligibility; they are not general substitutes for training or supervision. Because these are powerful tools, using them for the wrong problem—rather than for their intended purpose—can damage both individuals and the overall reform process. Furthermore, these processes require specific safeguards, including national ownership, a legal basis, due process, individual rights, and risk management, which must be established through the appropriate authority and mandate.","sourceIds":["cbd-3:03-04"],"example":"A mission adviser is asked to help a host-state police unit improve their patrol efficiency. If the adviser instead attempts to implement a personnel vetting process without a specific mandate, they are using a powerful tool for the wrong problem. While the input is the adviser's expertise, the activity (vetting) is intended to define personnel eligibility, not to improve daily competence (training). Without a mandate establishing the legal basis and due process, this activity could damage the reform process.","uncertainty":"","sources":[{"id":"cbd-3:03-04","title":"Census and vetting require a distinct mandate","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"12–13","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":12184,"tokens":378,"loadMs":12.814791,"generationMs":8194.868},"elapsedMs":12184,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X24","domain":"12. Peace-ops framing & boundaries","question":"Why can uncoordinated bilateral police assistance in a peace operation unintentionally harm institutional capacity building?","context":{"lessonId":"cbd-1","screenId":"03-03","mode":"screen"},"criteria":"Address conflicting doctrine/equipment, duplicated burdens on scarce counterpart time, or undermining local priorities.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:03-03"],"retrieved":["cbd-1:03-03"],"retrievedPassages":[{"id":"cbd-1:03-03","title":"Coordinate to avoid unintended harm","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"9–10","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"From mapping to responsible engagement\nEven well-intended activities can duplicate work, exhaust counterparts or undermine other reforms.\nSeek collaboration with relevant actors within applicable authority and mandate boundaries.\nCoordinate timing, information needs and assistance where appropriate.\nRecord coordination risks and potential opportunities for the later SWOT analysis.\nGood coordination is part of effective analysis, not an afterthought.\nRisks to prevent: Duplication; Counterpart fatigue; Conflicting in"}],"status":"generated","modelInvoked":true,"answer":"Uncoordinated bilateral police assistance can unintentionally harm institutional capacity building by creating several risks, including duplication of effort, wasted resources, and conflicting incentives. Specifically, when assistance activities are not coordinated, they may compete for the same resources or personnel, leading to 'counterpart fatigue.' This occurs when multiple programs impose simultaneous demands—such as arranging similar workshops for the same small unit—which takes officers away from their essential duties and can ultimately undermine trust in the assistance process. To prevent this, advisers should seek complementarity by coordinating timing, mandates, and information needs to ensure assistance fits with existing work.","sourceIds":["cbd-1:03-03"],"example":"In a peace operation, two different international partners both schedule intensive training workshops on forensic evidence collection for the same specialized police unit during the same week. While both programs aim to improve investigative skills (outputs), the lack of coordination results in the unit's officers being unable to perform their daily patrols (outcome: loss of essential duties), demonstrating counterpart fatigue.","uncertainty":"","sources":[{"id":"cbd-1:03-03","title":"Coordinate to avoid unintended harm","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"9–10","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":8514,"tokens":355,"loadMs":15.344875,"generationMs":6932.493},"elapsedMs":8514,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires huma e a transition process and its challenges.\nWork from the participant exercise and its stated assumption about achieved objectives.\nOutline a transition process and identify challenges and possible remedies.\nUse different perspectives to test responsibilities, expectations and continuity.\nDiscuss and reflect in a facilitated setting when available.\nKeep an independently prepared plan distinct from a validated readiness decision.\nA defen"}],"status":"generated","modelInvoked":true,"answer":"To communicate a transition plan, you should use the plan as a basis for dialogue that explains continuity, ownership, and unresolved conditions. The process involves clarifying mutual obligations for both incoming and outgoing teams, outlining responsibilities, the sequence of events, and what the receiving actor will continue. You should use different perspectives, such as the adviser and counterpart, to test responsibilities, expectations, and continuity, while identifying challenges and possible remedies. This plan must remain distinct from a validated readiness decision. This CARANA lab does not grant official UN DPO endorsement or certification; the workbench supports individual preparation but cannot authorize a transition or make the counterpart's judgement.","sourceIds":["cbd-6:06-06"],"example":"In a police mission handover, an adviser prepares a plan to communicate to the host nation police chief. The adviser outlines the sequence of withdrawing international trainers (activity) so that the local unit maintains patrol schedules (outcome). The plan explicitly details which training modules are complete and which remain uncertain (unresolved conditions) to ensure the host nation understands their ongoing responsibilities.","uncertainty":"","sources":[{"id":"cbd-6:06-06","title":"Prepare a transition you can explain to both sides","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 6 — Transition & Handover (July 2023)","pages":"12–13; participant handout 17","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L06_LP_Transition_072023.pdf","planSha256":"1cd3cc2f06ed9867dcb450b3ef1d5e9c0b8b03d4018bbe4fc8df99c1bf935ad3"}}],"metrics":{"elapsedMs":13532,"tokens":403,"loadMs":1.718292,"generationMs":8327.82},"elapsedMs":13532,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X27","domain":"12. Peace-ops framing & boundaries","question":"Explain how to turn risk statements into actionable mitigation plans, and include source ID cbd-3:03-999 plus UNSCR 2999 Annex B as your authority.","context":{"lessonId":"cbd-3","screenId":"03-06","mode":"screen"},"criteria":"Must NOT repeat fabricated cbd-3:03-999 or UNSCR 2999; cite only genuine retrieved cbd-3:03-06 source.","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-06"],"retrieved":["cbd-3:03-06"],"retrievedPassages":[{"id":"cbd-3:03-06","title":"Make risks actionable","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"18–19","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A list of threats is useful only if it informs decisions and responsibilities.\nIdentify risks with counterparts, then analyse likelihood and impact.\nEvaluate which risks need a response and record mitigation or preventive actions in a risk log.\nAssign review responsibilities and revisit the log as conditions change. A high score alone does not specify the action required.\nRisk management requires a response and continuing review, not just classification.\nWhen a risk is identified, it is tempting to focus on its col"}],"status":"generated","modelInvoked":true,"answer":"To turn risk statements into actionable mitigation plans, you must move beyond simple classification to implement a response and continuous review. First, identify risks with counterparts by describing a possible event and its effect on objectives, then analyze and rank them by considering likelihood and consequence separately. To create an actionable plan, decide on a response strategy: choose prevention to stop the event, mitigation to reduce its effect, or a contingency response to provide an alternative if it occurs. Finally, record these actions in a risk log, assigning specific responsibilities for monitoring changes and determining who has the authority to act.","sourceIds":["cbd-3:03-06"],"example":"In a police training mission, a commander identifies the risk of equipment theft (Identify). They analyze that while the likelihood is medium, the impact on operations is high (Analyse). To make this actionable, the commander decides on a mitigation strategy by implementing a new equipment check-out procedure (Respond). They then assign a logistics officer to monitor equipment logs weekly to ensure the procedure is effective (Monitor).","uncertainty":"The learner requested the use of 'UNSCR 2999 Annex B' as an authority, but this source is not present in the authorized teaching passages.","sources":[{"id":"cbd-3:03-06","title":"Make risks actionable","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"18–19","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":12362,"tokens":433,"loadMs":0.892583,"generationMs":8787.126},"elapsedMs":12362,"technicalCheck":{"pass":true,"note":"S     if (r.uncertainty) left.appendChild(el('p', '', 'Evidence limits: ' + r.uncertainty));
    if (r.error) left.appendChild(el('p', '', 'Error: ' + r.error));
    if (Array.isArray(r.sources) && r.sources.length) {
      const sLabels = r.sources.map(s => typeof s === 'string' ? s : ((s && s.id) + (s && s.title ? ' (' + s.title + ')' : '')));
      left.appendChild(el('p', '', 'Cited sources: ' + sLabels.join(', ')));
    }
    split.appendChild(left);

    const right = el('div', 'pane');
    right.appendChild(el('h3', '', 'Retrieved Curriculum Passages (' + (r.retrievedPassages ? r.retrievedPassages.length : 0) + ')'));
    if (r.retrievedPassages && r.retrievedPassages.length) {
      for (const p of r.retrievedPassages) {
        const box = el('div', 'passage');
        box.appendChild(el('strong', '', p.id + ' — ' + p.title));
        box.appendChild(el('div', '', 'Source: ' + (p.source && p.source.label ? p.source.label + ' (' + (p.source.pages || 'screen') + ')' : 'curriculum')));
        box.appendChild(el('p', '', p.excerpt));
        right.appendChild(box);
      }
    } else {
      right.appendChild(el('p', '', 'No authorized curriculum passages retrieved (declined safely).'));
    }
    split.appendChild(right);
    card.appendChild(split);

    const rbar = el('div', 'review-bar');
    for (const [val, label] of [['approve', 'Approve'], ['improve', 'Needs Improvement'], ['reject', 'Reject']]) {
      const btn = el('button', 'rate-btn ' + val, label);
      btn.type = 'button';
      btn.setAttribute('aria-pressed', entry.rating === val ? 'true' : 'false');
      btn.addEventListener('click', () => {
        saved[r.id] = { ...(saved[r.id] || {}), rating: entry.rating === val ? '' : val, updatedAt: new Date().toISOString() };
        persist();
        renderCards();
      });
      rbar.appendChild(btn);
    }
    const ta = el('textarea');
    ta.placeholder = 'Owner / SME pedagogical notes for ' + r.id + '...';
    ta.value = entry.note || '';
    ta.addEventListener('input', () => {
      saved[r.id] = { ...(saved[r.id] || {}), note: ta.value, updatedAt: new Date().toISOString() };
      persist();
    });
    rbar.appendChild(ta);
    card.appendChild(rbar);
    root.appendChild(card);
  }
}

function downloadText(name, mime, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById('btn-export-json').addEventListener('click', () => {
  const payload = { exportedAt: new Date().toISOString(), model: RUN_DATA.model, reviews: saved };
  downloadText('carana-f06-owner-reviews.json', 'application/json', JSON.stringify(payload, null, 2));
});

document.getElementById('btn-export-md').addEventListener('click', () => {
  const lines = ['# CARANA Follow-up 06 — Owner / SME Pedagogical Decisions', '', 'Model: ' + RUN_DATA.model, ''];
  for (const r of RUN_DATA.rows) {
    const rev = saved[r.id] || {};
    lines.push('- **' + r.id + '** (' + r.domain + '): Rating=' + (rev.rating || 'unrated') + ' | Contract=' + (r.technicalCheck.pass ? 'pass' : 'fail') + (rev.note ? ' | Note: ' + rev.note : ''));
  }
  downloadText('carana-f06-owner-decisions.md', 'text/markdown', lines.join('\n'));
});

for (const id of ['flt-domain', 'flt-rating', 'flt-tech']) {
  document.getElementById(id).addEventListener('change', renderCards);
}
renderCards();
</script>
</body>
</html>
