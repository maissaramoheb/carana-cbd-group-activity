, Lesson 1 (2021; PDF dated 07/2023)","pages":"14–15","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"The areas axis\nThe lesson identifies five broad areas in which national police capacity should be assessed.\nPolice services: knowledge, skills, command and control.\nEnabling services: people, training, finance, logistics and support.\nPolice policy formulation; accountability mechanisms; and stakeholder engagement.\nA weakness in investigation outcomes can originate well beyond an investigator's skills.\nFive CBD areas: Police services; Enabling services; Police policy formulation; Accountability mechanisms; Stakehold"}],"status":"generated","modelInvoked":true,"answer":"Situational analysis must combine these three lenses because they are not competing reports but mutually informative perspectives that provide a coherent diagnosis. The Conflict lens identifies the environmental dynamics (political, social, legal, etc.) that shape what is possible. The Response lens identifies existing actors and mandates to understand what is already being done before proposing new activities. The CBD lens examines the counterpart's actual operations, including institutional systems and practitioner performance. Integrating these lenses allows analysts to see how an internal police weakness might actually be caused by external insecurity or overlapping donor programs, ensuring that interventions address root causes rather than treating every symptom as an individual training gap.","sourceIds":["cbd-1:01-02","cbd-1:04-01","cbd-1:05-01"],"example":"","u cal incentives, SSR structures, culture and resources shape what changes are legitimate, feasible and sustainable.\nNever assume a familiar policing model is automatically transferable.\nLocal-fit test: Lawful?; Contextually relevan"},{"id":"cbd-1:01-02","title":"Three lenses, one coherent diagnosis","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"1–2, 5, 9, 11","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"Analyses serve different purposes\nSituational analysis is not a single checklist. The lesson combines three mutually informative perspectives.\nConflict analysis: what political, socioeconomic, legal, security and other dynamics shape the environment?\nResponse analysis: which organisations and actors are already intervening, and how?\nCBD analysis: how does the counterpart actually operate, and what capacities, structures and constraints exist?\nContext → existing responses → counterpart reality.\nThe analytical sequen"}],"status":"generated","modelInvoked":true,"answer":"Before proposing a new unit, an adviser must use a 'local-fit test' to ensure the proposal is lawful. Specifically, regarding legal and institutional authority, the adviser must check if host-country law permits the practice by inspecting legal powers, the institutional mandate, and required safeguards. Additionally, the adviser should use the conflict analysis lens to examine the legal dynamics shaping the operating environment. It is essential to distinguish between statutory law, administrative policy, and local practice, as different legal traditions affect the powers, duties, and safeguards of law enforcement. The adviser must ensure the proposal fits the host state's legal powers and respects local institutions.","sourceIds":["cbd-1:02-03","cbd-1:01-02"],"example":"","uncertainty":"","sources":[{"id":"cbd-1:02-03","title":"Law and institutional context matter","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"2, 8","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}},{"id":"cbd-1:01-02","title":"Three lenses, one coherent diagnosis","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"1–2, 5, 9, 11","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":7246,"tokens":282,"loadMs":3.597125,"generationMs":5274.579},"elapsedMs":7246,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X3","domain":"2. Root-cause diagnosis","question":"A station has backlog delays in case files. How should a CBD adviser keep staff from jumping straight to a training fix before checking root causes?","context":{"lessonId":"cbd-1","screenId":"02-02","mode":"screen"},"criteria":"Separate visible backlog symptoms from competing underlying system drivers (supervision, workflow, incentives, skills); treat initial causes as hypotheses.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:02-02","cbd-1:01-01"],"retrieved":["cbd-1:04-01"],"retrievedPassages":[{"id":"cbd-1:04-01","title":"What actually happens inside the institution?","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"11, 20","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"CBD analysis\nCBD analysis looks at the counterpart's real policing systems, practice, structure and constraints.\nConsider the organisation, department or unit that will own the change.\nExamine performance as it occurs, rather than only what formal documents claim.\nIdentify issues that warrant deeper inquiry and that can later inform SWOT and baseline formulation.\nStart with counterpart reality and local ownership.\nLevels to investigate: Enabling environment; Organisation / department; Individual practitioner\nTHREE "}],"status":"generated","modelInvoked":true,"answer":"To prevent jumping straight to a training fix, a CBD adviser must investigate three analytical levels of capacity rather than attributing weaknesses solely to staff training. First, examine the enabling environment, including legal frameworks, policy constraints, and wider resources. Second, investigate the institution or unit level to see if organizational systems—such as supervision, processes, accountability, staffing, and logistics—are affecting practice. Third, examine the practitioner level to understand individual competencies within real working conditions and organizational constraints. The adviser should examine performance as it actually occurs instead of relying on formal documents and must ensure the counterpart helps define the reality and the problems worth solving to maintain local ownership.","sourceIds":["cbd-1:04-01"],"example":"A police station reports a backlog of case files (performance complaint). Instead of immediately proposing a training course on report writing (preferred intervention), a CBD adviser investigates the institution level and discovers that the lack of a consistent filing process and inadequate supervision (organizational systems) are the true causes. The adviser also checks the enabling environment to see if budget constraints (wider resources) prevent the procurement of necessary filing equipment.","uncertainty":"","sources":[{"id":"cbd-1:04-01","title":"What actually happens inside the institution?","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"11, 20","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":10415,"tokens":459,"loadMs":1.834166,"generationMs":8829.27},"elapsedMs":10415,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X4","domain":"2. Root-cause diagnosis","question":"How does moving from scattered field observations to structured issues prevent circular problem statements during CBD diagnosis?","context":{"lessonId":"cbd-1","screenId":"05-03","mode":"screen"},"criteria":"Synthesize verified observations into specific evidence-backed capacity issues rather than restating \"lack of workshops\" as the problem.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:05-03"],"retrieved":["cbd-1:05-03"],"retrievedPassages":[{"id":"cbd-1:05-03","title":"Move from observations to structured issues","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"14–18, 20–21","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"The 5 × 6 analytical matrix\nThe goal is to connect source-based institutional issues with the relevant area and dimension.\nRead each evidence item and identify the underlying capacity or institutional issue.\nChoose the most relevant CBD area and specialised dimension; justify the link.\nAvoid automatically assigning everything to general policing practice when a more specific dimension applies.\nA useful matrix records defensible issues—not a list of unsupported assumptions.\nClassification logic: Evidence item; CBD a"}],"status":"generated","modelInvoked":true,"answer":"Moving from scattered observations to structured issues prevents circular problem statements by requiring a systematic classification logic: identifying the evidence item, the CBD area, the relevant dimension, and the specific issue to investigate. Instead of recording unsupported assumptions, the matrix focuses on identifying underlying capacity or institutional issues derived from evidence. By linking these issues to specific dimensions and justifying the connection, the process ensures the matrix records defensible issues. This structured approach helps the team move beyond mere observations to understand needs and design responsible responses, rather than simply listing observations or defaulting to general policing practice.","sourceIds":["cbd-1:05-03"],"example":"During a situational analysis, a team observes that police vehicles are frequently broken down (evidence item). Instead of simply stating 'poor maintenance' (a circular observation), they use the matrix to identify the underlying institutional issue: the lack of a dependable system for tracking equipment maintenance. They then classify this under a specific CBD area and dimension, ensuring the finding is a defensible issue used to design a response, rather than an unsupported assumption.","uncertainty":"","sources":[{"id":"cbd-1:05-03","title":"Move from observations to structured issues","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"14–18, 20–21","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":7735,"tokens":363,"loadMs":15.293292,"generationMs":6759.742},"elapsedMs":7735,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X5","domain":"3. Stakeholder analysis","question":"Why can unexamined informal interests stall a technically sound policing reform even when leadership publicly welcomes assistance?","context":{"lessonId":"cbd-1","screenId":"03-02","mode":"screen"},"criteria":"Address tacit incentives, turf, informal routines, or spoilers beneath stated formal support.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:03-02"],"retrieved":["cbd-1:03-02"],"retrievedPassages":[{"id":"cbd-1:03-02","title":"Interests are not always visible","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"9","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"Understand incentives\nAn actor's public position may differ from its actual interests or needs.\nPower aspirations, organisational incentives and resource pressures can shape cooperation.\nHost-nation reluctance to engage with external actors may be based on credible concerns.\nConsider how proposed engagement may affect legitimacy, relationships and local ownership.\nUnderstand motivations before designing engagement.\nAsk beyond the formal title: Position; Interest; Need; Possible impact\nPOSITION · INTEREST · NEED\nWha"}],"status":"generated","modelInvoked":true,"answer":"Unexamined informal interests can stall reform because an actor's public position often differs from their actual interests or needs. While leadership may publicly welcome assistance (their Position), underlying factors such as power aspirations, organizational incentives, or resource pressures can shape their true level of cooperation. For instance, an organization might publicly support a technical reform while privately fearing the loss of influence or resources. Additionally, reluctance may arise from legitimate concerns regarding how engagement affects legitimacy or from previous experiences with unrealistic promises. Therefore, understanding the underlying interests and needs is essential to prevent hidden motivations from undermining the reform process.","sourceIds":["cbd-1:03-02"],"example":"In a police capacity-building mission, a national police headquarters publicly agrees to a new digital forensics training program (Position). However, the department's leadership secretly fears the new technology will reduce the influence of senior officers who currently control manual evidence processing (Interest). Because the trainers only addressed the official position and failed to explore the underlying interest, the leadership subtly withholds necessary laboratory access, stalling the reform.","uncertainty":"","sources":[{"id":"cbd-1:03-02","title":"Interests are not always visible","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"9","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":8038,"tokens":380,"loadMs":1.426625,"generationMs":7111.215},"elapsedMs":8038,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X6","domain":"3. Stakeholder analysis","question":"When mapping people, power, and interest, why is formal rank alone an unreliable indicator of reform leverage?","context":{"lessonId":"cbd-1","screenId":"04-03","mode":"screen"},"criteria":"Distinguish formal hierarchy from operational gatekeepers, informal influence, and engagement strategy tailored to interest/power.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:04-03","cbd-1:03-02"],"retrieved":["cbd-1:04-03","cbd-1:03-02"],"retrievedPassages":[{"id":"cbd-1:04-03","title":"Map people, power and interest","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"12–13","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"Stakeholder analysis\nStakeholders are those involved in, influencing or affected by proposed CBD activities.\nIdentify both formal decision-makers and actors with informal influence.\nAssess their level of interest, influence and potential impact.\nChoose engagement and communication approaches proportionate to their role and revisable over time.\nInfluence and interest guide engagement, not simplistic labels of good and bad actors.\nPower / interest planning: High power · high interest; High power · lower interest; Low"},{"id":"cbd-1:03-02","title":"Interests are not always visible","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"9","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"Understand incentives\nAn actor's public position may differ from its actual interests or needs.\nPower aspirations, organisational incentives and resource pressures can shape cooperation.\nHost-nation reluctance to engage with external actors may be based on credible concerns.\nConsider how proposed engagement may affect legitimacy, relationships and local ownership.\nUnderstand motivations before designing engagement.\nAsk beyond the formal title: Position; Interest; Need; Possible impact\nPOSITION · INTEREST · NEED\nWha"}],"status":"generated","modelInvoked":true,"answer":"Formal rank alone is an unreliable indicator of reform leverage because while an organizational chart identifies formal authority, reform can also be shaped by informal influence. Relying solely on formal titles ignores actors with significant informal influence who can impact the process. Furthermore, a stakeholder's official position is only the visible layer; their actual interests, needs, or motivations—such as resource pressures or power aspirations—may differ from their public stance. Effective stakeholder analysis requires identifying both formal decision-makers and those with informal influence, as well as assessing their changing levels of interest and impact, rather than relying on simplistic labels or formal positions.","sourceIds":["cbd-1:04-03","cbd-1:03-02"],"example":"","uncertainty":"","sources":[{"id":"cbd-1:04-03","title":"Map people, power and interest","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"12–13","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}},{"id":"cbd-1:03-02","title":"Interests are not always visible","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"9","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":6973,"tokens":299,"loadMs":1.23625,"generationMs":5329.103},"elapsedMs":6973,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X7","domain":"4. Capacity assessment","question":"Why does the curriculum assess five distinct areas of institutional police capacity instead of focusing only on officer training and vehicles?","context":{"lessonId":"cbd-1","screenId":"05-01","mode":"screen"},"criteria":"Show that individual skill or equipment fails if strategy/doctrine, organisational systems, oversight, or partnerships do not support it.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:05-01"],"retrieved":["cbd-1:05-01"],"retrievedPassages":[{"id":"cbd-1:05-01","title":"Five areas of institutional capacity","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"14–15","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"The areas axis\nThe lesson identifies five broad areas in which national police capacity should be assessed.\nPolice services: knowledge, skills, command and control.\nEnabling services: people, training, finance, logistics and support.\nPolice policy formulation; accountability mechanisms; and stakeholder engagement.\nA weakness in investigation outcomes can originate well beyond an investigator's skills.\nFive CBD areas: Police services; Enabling services; Police policy formulation; Accountability mechanisms; Stakehold"}],"status":"generated","modelInvoked":true,"answer":"The curriculum assesses five distinct areas because institutional capacity is composed of five connected areas, and focusing solely on individual skills or resources like vehicles would be insufficient. The framework prevents practitioners from treating every symptom, such as weak investigation outcomes, as an individual training gap. By examining police services, enabling services, policy formulation, accountability mechanisms, and stakeholder engagement, the analysis can identify if a problem actually originates from broader issues like logistics, policy guidance, oversight, or communication with communities. This comprehensive approach ensures that the root cause is identified by looking beyond core policing services to the supporting systems and institutional structures.","sourceIds":["cbd-1:05-01"],"example":"During a capacity assessment, a police unit reports a high rate of unsolved crimes. Instead of immediately labeling this as a lack of investigator training (an output of enabling services), the CBD framework allows the assessor to investigate if the issue is actually due to a lack of forensic logistics (enabling services), outdated investigation protocols (policy formulation), or a lack of community reporting due to poor external interaction (stakeholder engagement).","uncertainty":"","sources":[{"id":"cbd-1:05-01","title":"Five areas of institutional capacity","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"14–15","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":9605,"tokens":426,"loadMs":1.250792,"generationMs":8346.337},"elapsedMs":9605,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X8","domain":"4. Capacity assessment","question":"Explain why six cross-cutting dimensions must be examined across every capacity area rather than isolated into one separate annex.","context":{"lessonId":"cbd-1","screenId":"05-02","mode":"screen"},"criteria":"Show how cross-cutting considerations shape fairness, sustainability, and operational quality in all functional capacity areas.","expectRetrieve":true,"expectedRelevantIds":["cbd-1:05-02"],"retrieved":["cbd-1:05-02"],"retrievedPassages":[{"id":"cbd-1:05-02","title":"Six dimensions cross every area","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"16–17","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]},"excerpt":"The dimensions axis\nThe same institutional issue may have consequences across several cross-cutting requirements.\nPolicing practice, environmental sustainability and conflict prevention.\nHuman rights, gender and comprehensive protection of civilians (CPOC).\nHuman rights and protection considerations are substantive analytical obligations, not decoration.\nThe five areas × six dimensions provide a disciplined classification framework.\nSix cross-cutting dimensions: Policing practice; Environmental sustainability; Conf"}],"status":"generated","modelInvoked":true,"answer":"The six cross-cutting dimensions—policing practice, environmental sustainability, conflict prevention, human rights, gender, and comprehensive protection of civilians (CPOC)—must be examined across every capacity area because they function as a disciplined classification framework where the five areas and six dimensions work together. These dimensions are not merely a separate box to tick at the end of a process. Instead, they are integrated because a single institutional issue may have consequences across several different cross-cutting requirements. Each dimension is used to analyze how a specific capacity issue affects how policing is delivered and experienced, such as how a new reporting process might simultaneously impact efficiency, access, accountability, or protection.","sourceIds":["cbd-1:05-02"],"example":"When analyzing the introduction of a new digital patrol logging system (capacity area), an analyst does not treat human rights as a separate annex. Instead, they use the dimensions axis to see how this system affects policing practice (efficiency of patrols), gender (access for female officers), and human rights (data privacy and accountability).","uncertainty":"","sources":[{"id":"cbd-1:05-02","title":"Six dimensions cross every area","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training on Capacity-Building and Development, Lesson 1 (2021; PDF dated 07/2023)","pages":"16–17","file":"course/lesson1-data.js","sha256":"9262ad32af940ae72708f7bb280418f08bbecce83980285628743b2514b75042","digitalFiles":[{"file":"course/visual-journey.js","sha256":"b6096911d16853c758c4561fa4425cfe152def698c164fe423b0f40b7d2d78ec"},{"file":"course/lesson1-experience.js","sha256":"d7cad01df1f4702bb4129200d567d99affa7257bc3cd5fcf5ab6dc406d2326df"},{"file":"course/lesson1-illustrations.js","sha256":"72dc03ef2c592a5c10daa808f047641dedcbd4309529ebd844940537a72048de"}]}}],"metrics":{"elapsedMs":8398,"tokens":385,"loadMs":1.5015,"generationMs":7413.894},"elapsedMs":8398,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X9","domain":"5. Results-based management","question":"Why is an indicator that simply counts brochures distributed or hours delivered weak for results-based management?","context":{"lessonId":"cbd-2","screenId":"02-05","mode":"screen"},"criteria":"Explain decision relevance: indicators must inform management decisions on real change rather than merely logging busy activity.","expectRetrieve":true,"expectedRelevantIds":["cbd-2:02-05"],"retrieved":["cbd-2:02-05"],"retrievedPassages":[{"id":"cbd-2:02-05","title":"Choose indicators that inform decisions","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 2 — Objective Setting (July 2023)","pages":"20–21","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L02_LP_Objective Setting_072023.pdf","planSha256":"ef3bb91eac60f7704b0661a786ec6cffbe195f98021fa8ccdd192a312cd61534"},"excerpt":"The number of delivered workshops may be easy to count without telling you whether policing practice improved.\nChoose measures that reflect the intended result and can be gathered and managed.\nThe source emphasises countable indicators while allowing more than one perspective on a complex objective.\nSpecify the observation and compare it with the baseline and intended result. Keep the number of indicators proportionate to the collection effort.\nAn activity count does not establish the quality of the intended result"}],"status":"generated","modelInvoked":true,"answer":"An indicator that simply counts brochures distributed or hours delivered is considered weak for results-based management because it represents an activity count rather than a measure of quality or change. While such counts are easy to track, they do not establish whether the intended result or policing practice has actually improved. Such indicators answer delivery questions (e.g., using a workshop register) but fail to provide evidence regarding practice or the reasons why a change occurred. To be effective, indicators should reflect the intended result and provide meaningful observations that can inform subsequent decisions.","sourceIds":["cbd-2:02-05"],"example":"In a police training program, counting the number of officers who attended a human rights seminar (activity/output) is a weak indicator because it does not prove that officers are applying human rights standards during patrols (outcome). A stronger, though more complex, indicator would be a review of work products, such as incident reports, to observe changes in practice.","uncertainty":"","sources":[{"id":"cbd-2:02-05","title":"Choose indicators that inform decisions","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 2 — Objective Setting (July 2023)","pages":"20–21","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L02_LP_Objective Setting_072023.pdf","planSha256":"ef3bb91eac60f7704b0661a786ec6cffbe195f98021fa8ccdd192a312cd61534"}}],"metrics":{"elapsedMs":7302,"tokens":352,"loadMs":20.9645,"generationMs":6297.382},"elapsedMs":7302,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X10","domain":"5. Results-based management","question":"What is the purpose of testing a draft policing objective in a counterpart briefing before locking it into a plan?","context":{"lessonId":"cbd-2","screenId":"02-07","mode":"screen"},"criteria":"Verify shared meaning, operational feasibility, ownership, and data availability with the host counterpart.","expectRetrieve":true,"expectedRelevantIds":["cbd-2:02-07","cbd-2:02-02"],"retrieved":["cbd-2:02-07","cbd-2:02-04"],"retrievedPassages":[{"id":"cbd-2:02-07","title":"Test the objective in a counterpart briefing","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 2 — Objective Setting (July 2023)","pages":"16–19","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L02_LP_Objective Setting_072023.pdf","planSha256":"ef3bb91eac60f7704b0661a786ec6cffbe195f98021fa8ccdd192a312cd61534"},"excerpt":"A clear-looking objective can still hide different assumptions about whose service should improve.\nRead the result from the counterpart’s perspective: who is responsible and who experiences the change?\nExplain the intended change in plain language before agreeing the number. A target without a shared definition can create misleading agreement.\nInvite a challenge about capability, inclusion and continuing support. Document the decision and its unresolved assumptions.\nShared wording is useful only when the parties sh"},{"id":"cbd-2:02-04","title":"Turn an intention into a testable objective","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 2 — Objective Setting (July 2023)","pages":"18–19","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L02_LP_Objective Setting_072023.pdf","planSha256":"ef3bb91eac60f7704b0661a786ec6cffbe195f98021fa8ccdd192a312cd61534"},"excerpt":"“Improve investigations” names a worthwhile direction but leaves the expected change unclear.\nSpecify the change and who or what it concerns. Make progress measurable and time-bound.\nCheck achievability with those responsible and relevance to the diagnosed need and strategic framework.\nAgree a realistic scope before selecting the exact target. A numerical target invented without baseline evidence is not a sound objective.\nSMART wording should make an agreed and feasible result testable; it should not disguise missi"}],"status":"generated","modelInvoked":true,"answer":"Testing a draft policing objective in a counterpart briefing serves to uncover hidden assumptions about whose service should improve and ensures all parties share the same operational meaning of the wording. It allows you to verify the intended change in plain language, preventing misleading agreement caused by different interpretations of a single phrase. During this process, you can identify who is responsible for the change, who experiences it, and how it fits existing responsibilities. Furthermore, the briefing provides an opportunity to invite challenges regarding capability, inclusion, and continuing support, helping to define the scope and record any unresolved assumptions or remaining decisions.","sourceIds":["cbd-2:02-07","cbd-2:02-04"],"example":"During a briefing with a local police commander, a trainer proposes an objective to 'increase patrol frequency.' The commander interprets this as more vehicles on the road (an activity), while the trainer intends it to mean more community interactions (a change in practice). By testing this in the briefing, the trainer can clarify the intended change, identify that the commander is the responsible actor, and revise the objective to focus on the visible change in community engagement.","uncertainty":"","sources":[{"id":"cbd-2:02-07","title":"Test the objective in a counterpart briefing","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 2 — Objective Setting (July 2023)","pages":"16–19","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L02_LP_Objective Setting_072023.pdf","planSha256":"ef3bb91eac60f7704b0661a786ec6cffbe195f98021fa8ccdd192a312cd61534"}},{"id":"cbd-2:02-04","title":"Turn an intention into a testable objective","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 2 — Objective Setting (July 2023)","pages":"18–19","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L02_LP_Objective Setting_072023.pdf","planSha256":"ef3bb91eac60f7704b0661a786ec6cffbe195f98021fa8ccdd192a312cd61534"}}],"metrics":{"elapsedMs":9826,"tokens":428,"loadMs":1.037167,"generationMs":8143.369},"elapsedMs":9826,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X11","domain":"6. Theory of Change","question":"Explain the \"missing middle\" flaw in a Theory of Change when a team jumps straight from holding workshops to claiming public trust has been restored.","context":{"lessonId":"cbd-3","screenId":"03-02","mode":"screen"},"criteria":"Articulate intermediate institutional changes/outcomes and assumptions needed between deliverables and higher-level public trust.","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-02","cbd-3:03-01"],"retrieved":["cbd-3:03-02"],"retrievedPassages":[{"id":"cbd-3:03-02","title":"Explain the missing middle","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"10–11","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A theory of change asks how and why an activity is expected to contribute to change in its context.\nState the expected change before listing actions.\nExplain the causal reasoning: if the action occurs, what should follow, and why?\nIdentify assumptions about people, institutions and politics that could break the connection. This reasoning should influence the plan rather than become a separate diagram.\nOutputs need a plausible mechanism and conditions to contribute to an outcome.\nA theory of change makes a professio"}],"status":"generated","modelInvoked":true,"answer":"The 'missing middle' flaw occurs when a theory of change fails to explain the causal reasoning and mechanism connecting an activity to an outcome. In the scenario provided, jumping from workshops to restored public trust lacks the 'because'—the identification of the mechanism that explains how the workshop leads to trust. A valid theory of change must state the expected change and explain why it should follow the action. It must also address the 'provided that' conditions, such as institutional dependencies or incentives, that allow an output to contribute to an outcome. Without this causal bridge, the connection between the activity and the strategic goal remains unsupported and lacks scrutiny.","sourceIds":["cbd-3:03-02"],"example":"In a police capacity-building programme, a team lists the input (trainers), the activity (conducting human rights workshops), and the goal (increased public trust). However, they fail to include the 'middle' elements: the output (number of officers trained), the outcome (officers applying human rights standards in patrols), and the mechanism (because applying these standards reduces use-of-force incidents, which builds community confidence). By skipping from workshops directly to trust, they have ignored the necessary causal bridge and the conditions required for the change to occur.","uncertainty":"","sources":[{"id":"cbd-3:03-02","title":"Explain the missing middle","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"10–11","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":9835,"tokens":412,"loadMs":0.915417,"generationMs":8217.835999},"elapsedMs":9835,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X12","domain":"6. Theory of Change","question":"If a ministry approves a strong new policing policy on paper, what additional Theory of Change steps decide whether practice actually changes in stations?","context":{"lessonId":"cbd-3","screenId":"03-09","mode":"screen"},"criteria":"Address dissemination, supervisor follow-through, operational procedures, accountability, and capacity to apply the policy.","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-09","cbd-3:03-02"],"retrieved":["cbd-3:03-09"],"retrievedPassages":[{"id":"cbd-3:03-09","title":"A new policy needs a route into practice","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"16","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"Issuing a standard can establish direction without ensuring that anyone can apply it.\nPolicy development can introduce coherent standards and contribute to reform direction.\nConnect appropriate legislative and policy work with dissemination, explanation, training or advice where needed.\nMonitor implementation and compliance. A published document is an output, not proof that practice conforms to it.\nPlan for the use of a standard, not just its publication.\nPicture a carefully written procedure sitting on a shelf whi"}],"status":"generated","modelInvoked":true,"answer":"To ensure a new policy changes practice in stations, you must move beyond the initial output of a published document. According to the results logic, a policy contributes through a mechanism rather than its mere existence. The necessary steps include providing implementation support—such as dissemination, explanation, training, or advice—to enable personnel to understand and apply the standard. Additionally, you must monitor implementation and compliance by checking observed use. This allows you to examine evidence of practice and feed findings back into the support system to address any difficulties in application.","sourceIds":["cbd-3:03-09"],"example":"A police headquarters issues a new standard operating procedure (SOP) for managing crime scenes (output). To ensure this changes practice at local stations, the department provides training workshops and technical advice to officers (implementation support/activity). Supervisors then conduct field inspections to check if the SOP is being followed (observed use/monitoring). If inspections reveal officers are still using old methods, the findings are used to adjust the training (outcome/feedback loop).","uncertainty":"","sources":[{"id":"cbd-3:03-09","title":"A new policy needs a route into practice","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"16","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":10755,"tokens":388,"loadMs":1.62675,"generationMs":9155.543},"elapsedMs":10755,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X13","domain":"7. Activities, outputs, outcomes & goals","question":"Provide an invented UNPOL community-policing example showing how an activity, an output, an outcome, and a goal differ across the results chain.","context":{"lessonId":"cbd-3","screenId":"03-01","mode":"screen"},"criteria":"Concrete policing chain: action (activity) -> direct deliverable (output) -> behavioural/institutional uptake (outcome) -> societal impact (goal).","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-01","cbd-3:03-02"],"retrieved":["cbd-3:03-01","cbd-3:03-10"],"retrievedPassages":[{"id":"cbd-3:03-01","title":"Begin with the result, then test the chain","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"4–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A familiar activity is not a sufficient starting point for a reform plan.\nWork from the agreed goal and outcomes toward the outputs and activities needed to support them.\nFor each intended result, a logframe row states the result, how it will be measured or verified, where evidence will come from, and the external factors or assumptions that could prevent achievement. The reveal below explains the result hierarchy; construct the four-column plan in the linked workbench.\nAfter designing from the intended result, che"},{"id":"cbd-3:03-10","title":"Check one logframe row across four columns","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"5–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A result, its measure, its evidence source and its assumptions must refer to the same intended change.\nDescribe a result at a clear level: do not call a delivered session an institutional outcome.\nChoose a measure that speaks to that result, then identify where credible evidence can be obtained.\nMake external conditions explicit. Test the row horizontally as well as the result chain vertically.\nA coherent row asks one connected result-and-evidence question.\nA logframe can look complete when every cell contains word"}],"status":"generated","modelInvoked":true,"answer":"In a results chain, the components represent different levels of the hierarchy. The goal is the wider strategic intent, while the outcome describes the specific change the intervention seeks to support. The output is the direct deliverable produced by an activity, and the activity represents the work performed using necessary inputs. To ensure a coherent plan, one must work downward from the goal and outcomes to identify the required outputs and activities, then check upward to verify if the activities and inputs can plausibly support the intended results.","sourceIds":["cbd-3:03-01","cbd-3:03-10"],"example":"In a UNPOL community-policing initiative: \n- Goal: Enhanced public safety and trust in the local police force.\n- Outcome: Increased community cooperation with police during investigations (a change in behavioral practice).\n- Output: Completion of ten community policing workshops for local leaders (a direct deliverable).\n- Activity: Conducting training sessions on community engagement (the action performed).","uncertainty":"","sources":[{"id":"cbd-3:03-01","title":"Begin with the result, then test the chain","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"4–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}},{"id":"cbd-3:03-10","title":"Check one logframe row across four columns","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"5–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":10570,"tokens":426,"loadMs":1.636,"generationMs":8198.741},"elapsedMs":10570,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X14","domain":"7. Activities, outputs, outcomes & goals","question":"Why does high attendance at a mentoring series prove delivery of an activity/output rather than sustained institutional capacity?","context":{"lessonId":"cbd-4","screenId":"04-03","mode":"screen"},"criteria":"Contrast delivery completion with durable routine institutional adoption under everyday operational pressure.","expectRetrieve":true,"expectedRelevantIds":["cbd-4:04-03","cbd-3:03-01"],"retrieved":["cbd-4:04-03"],"retrievedPassages":[{"id":"cbd-4:04-03","title":"A delivered activity is not sustained change","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"7–8","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"},"excerpt":"Completing the work plan does not automatically prepare people to adopt and sustain new practices.\nCBD builds and retains capability; change management prepares, guides and supports those affected.\nConsider executive support, active sponsorship, communication, ownership, resources and culture.\nExpect adoption and sustainment to take time beyond introducing the solution.\nInvestigate combinations of constraints rather than blaming one individual for every setback.\nManage the human and institutional change alongside t"}],"status":"generated","modelInvoked":true,"answer":"High attendance at a mentoring series proves the delivery of an activity or output because the completion of planned activities does not automatically result in adoption or sustainment. While CBD activities focus on building and retaining capability, sustainment requires managing human and institutional change, such as leadership support, ownership, and culture. High attendance only indicates that the activity occurred; it does not demonstrate that people have adopted new practices or that these practices continue in everyday work. Adoption and sustainment are longer-term objectives that must be monitored through changed institutional habits, rather than being automatic consequences of delivering a workshop or training series.","sourceIds":["cbd-4:04-03"],"example":"In a police training program, the input of trainers and training materials leads to the activity of a mentoring series. The output is the high number of officers who attended the sessions. However, if the outcome is not measured by observing whether officers apply new investigative techniques in their daily patrols, the attendance remains merely a delivered output rather than evidence of sustained institutional capacity.","uncertainty":"","sources":[{"id":"cbd-4:04-03","title":"A delivered activity is not sustained change","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"7–8","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"}}],"metrics":{"elapsedMs":7889,"tokens":372,"loadMs":2.372167,"generationMs":6988.322},"elapsedMs":7889,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X15","domain":"8. Logframes & indicators","question":"Give an invented UNPOL policing example showing why checking a single logframe row horizontally requires linking the result, indicator, means of verification, and assumption.","context":{"lessonId":"cbd-3","screenId":"03-10","mode":"screen"},"criteria":"Walk through one coherent policing row across all four logframe columns, verifying realistic evidence sources without inventing specific forms.","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-10"],"retrieved":["cbd-3:03-10","cbd-3:03-01"],"retrievedPassages":[{"id":"cbd-3:03-10","title":"Check one logframe row across four columns","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"5–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A result, its measure, its evidence source and its assumptions must refer to the same intended change.\nDescribe a result at a clear level: do not call a delivered session an institutional outcome.\nChoose a measure that speaks to that result, then identify where credible evidence can be obtained.\nMake external conditions explicit. Test the row horizontally as well as the result chain vertically.\nA coherent row asks one connected result-and-evidence question.\nA logframe can look complete when every cell contains word"},{"id":"cbd-3:03-01","title":"Begin with the result, then test the chain","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"4–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A familiar activity is not a sufficient starting point for a reform plan.\nWork from the agreed goal and outcomes toward the outputs and activities needed to support them.\nFor each intended result, a logframe row states the result, how it will be measured or verified, where evidence will come from, and the external factors or assumptions that could prevent achievement. The reveal below explains the result hierarchy; construct the four-column plan in the linked workbench.\nAfter designing from the intended result, che"}],"status":"generated","modelInvoked":true,"answer":"Checking a logframe row horizontally is necessary because the result, measure, evidence source, and assumptions must all refer to the same intended change. A row can appear complete if every cell contains words, yet fail to be coherent if the components do not address the same result-and-evidence question. For instance, if a result concerns the implementation of a new patrol routine, but the indicator only counts the number of training sessions delivered and the evidence source is a training attendance sheet, the row fails horizontal logic. The evidence (attendance) does not verify the intended change (the use of the routine). A valid row must ensure the observation addresses the specific result and identifies the necessary external conditions.","sourceIds":["cbd-3:03-10","cbd-3:03-01"],"example":"In a UNPOL mission, a logframe row aims for the Result: 'Increased use of community policing protocols by local officers.' If the Verification measure is 'Number of community meetings held,' the Indicator is 'Number of meeting minutes recorded,' and the Evidence source is 'A log of meeting dates,' the row lacks horizontal coherence. While the cells are measurable, the evidence (meeting dates) does not verify the actual change (the use of protocols by officers). To be coherent, the measure must address the protocol use, the evidence must be able to prove that use, and an External condition (such as 'Local community leaders remain engaged') must be explicitly stated.","uncertainty":"","sources":[{"id":"cbd-3:03-10","title":"Check one logframe row across four columns","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"5–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}},{"id":"cbd-3:03-01","title":"Begin with the result, then test the chain","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"4–7","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":13710,"tokens":492,"loadMs":2.067875,"generationMs":9702.578},"elapsedMs":13710,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X16","domain":"8. Logframes & indicators","question":"Why should an implementation team define a trigger and alternative delivery path inside the logframe/risk plan before disruption occurs?","context":{"lessonId":"cbd-3","screenId":"03-07","mode":"screen"},"criteria":"Prepare pre-agreed contingency triggers and practical fallback adjustments with counterparts instead of improvising during crisis.","expectRetrieve":true,"expectedRelevantIds":["cbd-3:03-07","cbd-3:03-06"],"retrieved":["cbd-3:03-07"],"retrievedPassages":[{"id":"cbd-3:03-07","title":"Prepare an alternative path before disruption","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"20–21","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"},"excerpt":"A contingency plan prepares for an outcome that differs from the expected course.\nIdentify and prioritise disruption scenarios, then plan how essential activity can continue or recover.\nSpecify key people, resources and responsibilities; share the plan with those who may need to act.\nKeep it current. Use your own Lesson 2 objective to construct a logframe and risk analysis in the original workbench, then seek a peer’s challenge to your assumptions.\nA contingency plan must be understood, assigned and maintained to b"}],"status":"generated","modelInvoked":true,"answer":"An implementation team should define a trigger and alternative delivery path in the logframe or risk analysis so that people can recognize when an event requires an alternative response and carry out their assigned responsibilities. Defining these elements ensures the plan is usable and that the reasoning is clear enough for a colleague to question the response without having to guess the author's intent. This process involves identifying which functions and resources need protection, determining who is responsible for deciding, acting, and communicating, and establishing when the alternative plan will be reviewed.","sourceIds":["cbd-3:03-07"],"example":"During a police training mission, the team identifies a risk that a specific training facility may become unavailable. In the risk plan, they define the trigger as 'official notice of venue unavailability.' The alternative path specifies that training will move to a secondary precinct (alternative response), identifies the mission trainer as the person who decides (responsibility), and ensures mobile training kits are available (resources).","uncertainty":"","sources":[{"id":"cbd-3:03-07","title":"Prepare an alternative path before disruption","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 3 — Planning Activities (July 2023)","pages":"20–21","file":"curricula/cbd/lessons-2-3.json","sha256":"b6f0a81223b5a0a6318296daba040b9583c91b441f0de04ba790478c83e0f8e3","referencedPlan":"JSTC_CBD_L03_LP_Planning_072023.pdf","planSha256":"ad91530c21f014942d83295238a5f9cc4cccc0961a646a09450ecdfec80f84ca"}}],"metrics":{"elapsedMs":9889,"tokens":391,"loadMs":1.0495,"generationMs":7589.793},"elapsedMs":9889,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X17","domain":"9. Implementation & problem-solving","question":"How does communication style during field implementation determine whether host counterparts own a change or treat it as an external compliance chore?","context":{"lessonId":"cbd-4","screenId":"04-02","mode":"screen"},"criteria":"Connect clear mutual dialogue, adaptation to counterparts, and shared problem-solving with sustainable ownership.","expectRetrieve":true,"expectedRelevantIds":["cbd-4:04-02"],"retrieved":["cbd-4:04-02"],"retrievedPassages":[{"id":"cbd-4:04-02","title":"Communicate for understanding and participation","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"5–6","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"},"excerpt":"The same reform message may need different explanations for leadership, supervisors and operational counterparts.\nMatch the message to the stakeholder’s role and context while keeping the facts consistent.\nUse the seven Cs: clarity, correctness, completeness, conciseness, concreteness, coherence and courtesy.\nCheck understanding through dialogue instead of assuming that delivering a message secures agreement.\nUse respectful language that explains the issue without labelling counterparts as the problem.\nClear commun"}],"status":"generated","modelInvoked":true,"answer":"Communication style determines ownership by matching the message to the stakeholder's specific role and context while maintaining factual consistency. Using the seven Cs—clarity, correctness, completeness, conciseness, concreteness, coherence, and courtesy—ensures the message is usable and respectful. Rather than assuming delivery secures agreement, practitioners should use dialogue to check understanding, inviting counterparts to describe what a change means in practice. This process allows for adjusting explanations to clarify confusion. Using respectful language that avoids labeling counterparts as the problem helps prevent them from viewing reforms as external burdens, instead connecting accurate information to the people required to act.","sourceIds":["cbd-4:04-02"],"example":"When introducing a new patrol logging system (input: training materials), a trainer conducts a briefing (activity) resulting in a completed training log (output). To ensure ownership, the trainer uses the seven Cs to explain the system to commanders (focusing on oversight) and officers (focusing on operational usability). By asking an officer to describe how they will log entries during a shift (checking understanding), the trainer identifies a confusion regarding timing and adjusts the explanation (outcome: officers correctly adopt the new routine rather than viewing it as an extra chore).","uncertainty":"","sources":[{"id":"cbd-4:04-02","title":"Communicate for understanding and participation","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"5–6","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"}}],"metrics":{"elapsedMs":13659,"tokens":419,"loadMs":1.134792,"generationMs":9053.018},"elapsedMs":13659,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X18","domain":"9. Implementation & problem-solving","question":"Give an invented field scenario where mid-implementation monitoring shows advisers diagnosed the wrong constraint, and explain how they should respond.","context":{"lessonId":"cbd-4","screenId":"04-07","mode":"screen"},"criteria":"Re-test assumptions openly, diagnose the newly revealed bottleneck with counterparts, and adjust support rather than forcing the original activity.","expectRetrieve":true,"expectedRelevantIds":["cbd-4:04-07","cbd-4:04-05"],"retrieved":["cbd-4:04-07"],"retrievedPassages":[{"id":"cbd-4:04-07","title":"New evidence can change the problem you are solving","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"8–10","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"},"excerpt":"A consistent method should help you revise a diagnosis, not protect the first explanation.\nSeparate an observed difficulty from your explanation of its cause.\nSeek the perspective of the people affected and consider more than one response.\nMonitor the response and return to definition or analysis when it does not address the problem. Resilience includes learning and adaptation.\nA response teaches you about the problem when you examine its effects.\nImagine you initially explain late reviews as low motivation. A coun"}],"status":"generated","modelInvoked":true,"answer":"When mid-implementation monitoring reveals that a response is not addressing the problem, advisers should return to the definition or analysis phase. Instead of protecting the initial explanation, advisers should use a consistent method to revise the diagnosis by separating the observed difficulty from the assumed cause. They should seek the perspectives of the affected people and examine the effects of their responses. A defensible approach involves comparing factors such as duties, authority, resources, and understanding with the affected staff to allow the causal explanation to be opened to new evidence, rather than assigning motives to observed delays.","sourceIds":["cbd-4:04-07"],"example":"In a police training mission, advisers initially diagnose slow adoption of new radio protocols as low motivation among officers (initial signal/explanation). During monitoring, they observe that officers are still not using the radios correctly (observed difficulty). Upon seeking the perspective of the officers, they discover the radios frequently run out of battery due to poor charging station placement (new evidence). To respond, the advisers should move back to the analysis phase, revise the diagnosis from 'low motivation' to 'resource/equipment constraint,' and test a revised response, such as implementing a new charging schedule, to examine its effect on protocol adoption.","uncertainty":"","sources":[{"id":"cbd-4:04-07","title":"New evidence can change the problem you are solving","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"8–10","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"}}],"metrics":{"elapsedMs":10800,"tokens":420,"loadMs":16.131333,"generationMs":9398.809},"elapsedMs":10800,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X19","domain":"10. Monitoring & evaluation","question":"Why must an evaluation team agree on key questions, comparisons, and evidence rules before going to gather extra field interviews?","context":{"lessonId":"cbd-5","screenId":"05-03","mode":"screen"},"criteria":"Prevent unfocused data collection, define counterfactual/baseline logic upfront, and match method to decision questions.","expectRetrieve":true,"expectedRelevantIds":["cbd-5:05-03"],"retrieved":["cbd-5:05-03"],"retrievedPassages":[{"id":"cbd-5:05-03","title":"Design the evaluation before collecting more data","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 5 — Evaluation & Adjustment (July 2023)","pages":"7","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L05_LP_Evaluation and Adjustment_072023.pdf","planSha256":"42e1f1956475b1a0fb4fbf01a9c1108a701c3abe655ee9a54b508fc3b6bf7400"},"excerpt":"Limited resources make a focused evaluation design and clear communication especially important.\nEngage those being evaluated and explain the purpose in advance.\nDefine scope, topics and indicators before selecting data-collection tools.\nChoose methods, instruments and sampling that can answer the questions.\nConsider quantitative and qualitative analysis, validity and reliability.\nPlan the reporting format, audience and involvement of counterparts.\nCollect evidence because it answers an evaluation question.\nImagine"}],"status":"generated","modelInvoked":true,"answer":"An evaluation team must agree on key questions, comparisons, and evidence rules beforehand because limited resources necessitate a focused evaluation design. By defining the scope, topics, and indicators before selecting tools, the team ensures that the chosen methods, instruments, and sampling are capable of answering the specific evaluation questions. Furthermore, collecting evidence must be driven by the need to answer these questions. Establishing these parameters ensures the quality of analysis regarding validity and reliability, and ensures that the final findings are presented in a format that stakeholders can use to take action.","sourceIds":["cbd-5:05-03"],"example":"A small police training evaluation team has only one week to assess a new community policing workshop. Instead of reviewing every single attendance sheet, the team first defines the scope (workshop impact) and indicators (change in officer behavior). They decide to use specific interview questions (methods) and a small group of officers (sampling) to collect qualitative evidence. This focused approach ensures they collect only the evidence necessary to answer their predefined questions within their resource constraints.","uncertainty":"","sources":[{"id":"cbd-5:05-03","title":"Design the evaluation before collecting more data","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 5 — Evaluation & Adjustment (July 2023)","pages":"7","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L05_LP_Evaluation and Adjustment_072023.pdf","planSha256":"42e1f1956475b1a0fb4fbf01a9c1108a701c3abe655ee9a54b508fc3b6bf7400"}}],"metrics":{"elapsedMs":10696,"tokens":357,"loadMs":33.506584,"generationMs":7003.1},"elapsedMs":10696,"technicalCheck":{"pass":true,"note":"Schema, grounding IDs, and boundary guards passed; requires human pedagogical inspection."}},{"id":"X20","domain":"10. Monitoring & evaluation","question":"How does routine implementation monitoring differ from formal evaluation in what questions each answers?","context":{"lessonId":"cbd-5","screenId":"05-01","mode":"screen"},"criteria":"Monitoring tracks ongoing delivery/early signals; evaluation examines broader outcomes, causal contribution, and why change happened or stalled.","expectRetrieve":true,"expectedRelevantIds":["cbd-5:05-01","cbd-4:04-04"],"retrieved":["cbd-4:04-04","cbd-5:05-01","cbd-5:05-06"],"retrievedPassages":[{"id":"cbd-4:04-04","title":"Monitor implementation and respond early","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 4 — Implementation (July 2023)","pages":"8","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L04_LP_Implementation_072023.pdf","planSha256":"ea8d082d612d75b37fe216cfd07007afe8f212d6cbdb2d43115f2b89370ede4a"},"excerpt":"Implementation is an ongoing responsibility. It requires checking progress and scanning the environment.\nReview implementation periodically instead of treating activities as set and forget.\nWatch for resistance, timing problems, weak support and unintended consequences.\nUse monitoring to identify when direction, activities or objectives may need review.\nDistinguish routine progress checks from the deeper outcome and impact assessment addressed in evaluation.\nNotice emerging constraints early enough to act with coun"},{"id":"cbd-5:05-01","title":"Ask what changed and why","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 5 — Evaluation & Adjustment (July 2023)","pages":"4","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L05_LP_Evaluation and Adjustment_072023.pdf","planSha256":"42e1f1956475b1a0fb4fbf01a9c1108a701c3abe655ee9a54b508fc3b6bf7400"},"excerpt":"Evaluation supports decisions about progress, shortcomings and future action. It needs a reference in the original plan.\nAsk whether the engagement worked, what did not work and why.\nUse the planned objectives and performance framework as a reference.\nDistinguish delivered activities from evidence about results.\nUse evaluation to support learning, improvement, transparency and accountability.\nEvaluation is valuable when it informs a defensible decision.\nImagine a project delivered every scheduled workshop, yet the "},{"id":"cbd-5:05-06","title":"A favourable comparison is not the whole explanation","source":{"kind":"approved-digital-adaptation","label":"UNPOL Job-Specific Training: CBD Lesson 5 — Evaluation & Adjustment (July 2023)","pages":"4, 6–7","file":"curricula/cbd/lessons-4-6.json","sha256":"7a6d739bc665a59d0639edf67d4246e24d0d50a4f2a850c14b558525f7120f9c","referencedPlan":"JSTC_CBD_L05_LP_Evaluation and Adjustment_072023.pdf","planSha256":"42e1f1956475b1a0fb4fbf01a9c1108a701c3abe655ee9a54b508fc3b6bf7400"},"excerpt":"Two observations may differ because practice changed, because the observation changed, or because other conditions changed.\nCheck definitions, selection and timing before comparing observations.\nCombine relevant quantitative and qualitative evidence; explain limitations and alternative interpretations.\nDo not let an overall improvement hide a documented unequal effect. Rights and gender sensitivity belong within evaluation reasoning.\nReport the pattern and its limits, including whose experience the pattern conceals"}],"status":"generated","modelInvoked":true,"answer":"Routine implementation monitoring and formal evaluation answer different questions. Monitoring focuses on progress checks and environmental scanning; it examines delivery against the agreed plan and looks for changes in support, participation, or emerging constraints to identify when activities or objectives need review. In contrast, formal evaluation addresses deeper outcome and impact assessments. Evaluation asks whether the engagem
